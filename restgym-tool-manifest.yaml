# RESTgym tool manifest
#
# Static metadata about the tool, written by the tool authors. RESTgym uses it to run the tool properly.
# Comment out the fields you do not know.
manifest_version: 1

# Identity and metadata
id: restest                      # must match the name of the tool directory in tools/, only lowercase letters, numbers and dashes
name: RESTest v2
version: "2.1.0"                  # quoted, so that YAML does not read it as a number
description: Black-box testing tool for REST APIs
license: Apache-2.0               # SPDX identifier
repository: https://github.com/isa-group/RESTest
homepage: https://github.com/isa-group/RESTest
authors:
  - name: Sergio Segura
    affiliation: Universidad de Sevilla
    orcid: 0000-0001-8816-6213
# citation:                       # no paper on RESTest 2 yet
#doi:

# What the tool can test
compatibility:
  openapi_versions: ["2.0", "3.0", "3.1"]  # "2.0" (Swagger), "3.0", "3.1", "3.2"
  spec_formats: [yaml, json]      # specification files read from /specifications/: json ({API}-openapi.json), yaml ({API}.yaml)
  budgets: [time]                 # Does the tool have a setting for time budget, request budget or both? [time, requests]

# What RESTgym must provide (omit the section if the tool has no special requirements)
# None: no GPU, and no network access at run time beyond the API under test.

# Large language models used by the tool, if any
# None: RESTest v2 uses no language model.

