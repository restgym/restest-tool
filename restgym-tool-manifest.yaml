# RESTgym tool manifest
manifest_version: 1

id: restest
name: RESTest
version: "2.1.0"                  # tag v2.1.0, commit 45cd3dc8, built from source by the Dockerfile
description: Black-box testing of REST APIs that generates requests from the OpenAPI document for the whole time budget, following a plan of nominal, sequence, mutation and fuzzing strategies, and judges every response against the document.
license: Apache-2.0
repository: https://github.com/isa-group/RESTest
homepage: https://github.com/isa-group/restest4restgym    # the RESTgym package of RESTest (this repository)
authors:
  - name: Sergio Segura
    affiliation: University of Seville
    orcid: 0000-0001-8816-6213
# citation:                       # not stated for RESTest 2, a complete rewrite sharing no code with RESTest 1.x
#   doi: 10.1145/3460319.3469082  # RESTest 1.x (ISSTA 2021 tool demo)

compatibility:
  openapi_versions: ["2.0", "3.0", "3.1"]  # RESTest README at 45cd3dc8: "RESTest reads OpenAPI 2.0, 3.0 and 3.1"
  spec_formats: [yaml, json]      # entrypoint.sh reads ${API}.yaml, and ${API}-openapi.json if there is no YAML
  budgets: [time]

# No special requirements: Java 21, CPU only, no network access at run time except to the API under test
# (the build fetches RESTest from GitHub and its dependencies from Maven Central)
# No language models
